<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Procurar Profissionais</title>
  <link rel="stylesheet" href="style.css">
  <script src="scripts/theme.js" defer></script>
  <script>
    const categorias = [
      "Arquitetos",
      "Canalizadores",
      "Carpinteiros",
      "Eletricistas",
      "Engenheiros",
      "Pedreiros",
      "Pintores"
    ];

    window.addEventListener('DOMContentLoaded', () => {
      const lista = document.getElementById('lista');
      if (!lista) return;

      categorias.forEach(c => {
        const item = document.createElement('div');
        item.className = 'input';
        item.style.cursor = 'pointer';
        item.style.alignItems = 'center';
        item.style.fontWeight = '500';
        item.style.marginTop = '8px'; // espaço vertical entre itens
        item.innerHTML = `
          <span>${c}</span>
          <span style="margin-left:auto;font-size:22px;">→</span>
        `;
        item.onclick = () => {
          if (c === "Arquitetos") location.href = "arquitetos.html";
          else alert("Página de " + c + " ainda não implementada.");
        };
        lista.appendChild(item);
      });
    });
  </script>
</head>

<body>
  <div class="app">
    <div class="card" role="main" aria-labelledby="searchTitle" style="justify-content:flex-start;">
      <div class="header">
        <button class="btn btn-primary" onclick="location.href='area.html'">←</button>
        <h2 id="searchTitle">Procurar</h2>
      </div>

      <!-- Lista de categorias, encostada ao título -->
      <div id="lista" style="margin-top: 0;"></div>
    </div>
  </div>
</body>
</html>
