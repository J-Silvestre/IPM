<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arquitetos</title>
  <link rel="stylesheet" href="style.css">
  <script src="scripts/theme.js" defer></script>
  <script>
    const arquitetos = [
      { nome: "Arquiteto 1" },
      { nome: "Arquiteto 2" },
      { nome: "Arquiteto 3" }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      const lista = document.getElementById('lista');
      if (!lista) return;

      arquitetos.forEach((a, i) => {
        const item = document.createElement('div');
        item.className = 'input';
        item.style.cursor = 'pointer';
        item.style.alignItems = 'center';
        item.style.fontWeight = '500';
        item.style.marginTop = '8px'; // espaço vertical entre itens
        item.innerHTML = `
          <span>${a.nome}</span>
          <span style="margin-left:auto;display:flex;gap:8px;">
               <button class="icon-btn" style="width:32px;height:32px;" onclick="verPerfil(${i})">👁</button>
            <button class="icon-btn" style="width:32px;height:32px;" onclick="abrirChat(${i})">💬</button>
          </span>
        `;
        lista.appendChild(item);
      });
    });

    function verPerfil(i){ location.href='architect-profiles.html?i='+i; }
    function abrirChat(i){ location.href='chat.html?i='+i; }
  </script>
</head>
<body>
  <div class="app">
    <div class="card" role="main" aria-labelledby="architectsTitle" style="justify-content:flex-start;">
      <div class="header">
        <button class="btn btn-primary" onclick="location.href='search.html'">←</button>
        <h2 id="architectsTitle">Arquitetos</h2>
      </div>
      <div id="lista" style="margin-top:0;"></div>
    </div>
  </div>
</body>
</html>
