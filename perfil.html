<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="scripts/theme.js" defer></script>
  <title>Perfil</title>
</head>
<body>
  <div class="app">
    <div class="card" role="main" aria-labelledby="profileTitle" style="justify-content:flex-start;">
      <div class="header">
        <button class="btn btn-primary" onclick="window.location.href='area.html'">←</button>
        <h2 id="profileTitle">Perfil</h2>
      </div>

      <form id="profileForm" onsubmit="event.preventDefault()">
        <div class="form-group">
          <div class="label">Nome completo</div>
          <div class="input"><input name="nome" value=""></div>
        </div>

        <div class="form-group">
          <div class="label">Morada</div>
          <div class="input"><input name="morada" value=""></div>
        </div>

        <div class="form-group">
          <div class="label">Código Postal</div>
          <div class="input"><input name="codpostal" value=""></div>
        </div>

        <div class="form-group">
          <div class="label">NIF / NIPC</div>
          <div class="input"><input name="nif" value=""></div>
        </div>

        <div class="form-group">
          <div class="label">Telemóvel</div>
          <div class="input"><input name="telemovel" value=""></div>
        </div>

        <div class="form-group">
          <div class="label">Concelho</div>
          <div class="input"><input name="concelho" value=""></div>
        </div>

        <div class="form-group">
          <div class="label">E-mail</div>
          <div class="input"><input type="email" name="email" value=""></div>
        </div>

        <div class="form-group" style="margin-bottom: 8px;">
          <div class="label">Password</div>
          <div class="input"><input type="password" name="password" value=""></div>
        </div>

        <div class="footer">
          <button class="btn btn-primary" type="submit">Guardar</button>
          <button class="btn btn-ghost" type="button" onclick="location.href='area.html'">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
