<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens</title>
  <link rel="stylesheet" href="style.css">
  <script src="scripts/theme.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="card" role="main" aria-labelledby="messagesTitle" style="justify-content:flex-start;">
      <div class="header">
        <button class="btn btn-primary" onclick="location.href='area.html'">&#8592;</button>
        <h2 id="messagesTitle">Mensagens</h2>
      </div>

      <div class="chat-list" style="margin-top: 8px; display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>
  <script>
    (function () {
      const STORAGE_KEY = 'conversations';
      const DELETED_DEFAULT_KEY = 'deletedDefaultConversations';
      const DEFAULT_CONVERSATIONS = [
        { id: 'default-1', name: 'Arquiteto 1', preview: 'Enviei-lhe as plantas atualizadas.' },
        { id: 'default-2', name: 'Ana', preview: 'Ola! Tudo bem?' },
        { id: 'default-3', name: 'Joao', preview: 'Podemos falar amanha?' },
        { id: 'default-4', name: 'Sara', preview: 'Enviei o documento!' }
      ];

      function loadConversations() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        } catch (e) {
          return [];
        }
      }

      function saveConversations(list) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      }

      function loadDeletedDefaults() {
        try {
          const parsed = JSON.parse(localStorage.getItem(DELETED_DEFAULT_KEY) || '[]');
          return new Set(Array.isArray(parsed) ? parsed : []);
        } catch (e) {
          return new Set();
        }
      }

      function saveDeletedDefaults(set) {
        localStorage.setItem(DELETED_DEFAULT_KEY, JSON.stringify(Array.from(set)));
      }

      function getLastTimestamp(conversation) {
        const last = conversation && conversation.messages && conversation.messages[conversation.messages.length - 1];
        return last && typeof last.ts === 'number' ? last.ts : 0;
      }

      function createRow({ name, preview, onOpen, onDelete }) {
        const list = document.querySelector('.chat-list');
        if (!list) return;

        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.alignItems = 'center';
        row.style.gap = '8px';

        const btn = document.createElement('button');
        btn.className = 'input chat';
        btn.type = 'button';
        btn.style.flex = '1';
        btn.onclick = onOpen;
        btn.innerHTML = `<strong>${name || 'Contacto'}</strong>
          <span style="margin-left:8px; color:var(--muted);">${preview}</span>`;

        const del = document.createElement('button');
        del.className = 'icon-btn';
        del.type = 'button';
        del.style.width = '32px';
        del.style.height = '32px';
        del.setAttribute('aria-label', 'Apagar conversa');
        del.textContent = '×';
        del.onclick = (ev) => {
          ev.stopPropagation();
          onDelete();
        };

        row.appendChild(btn);
        row.appendChild(del);
        list.appendChild(row);
      }

      function renderConversations() {
        const list = document.querySelector('.chat-list');
        if (!list) return;

        list.innerHTML = '';
        const deletedDefaults = loadDeletedDefaults();

        DEFAULT_CONVERSATIONS
          .filter((conv) => !deletedDefaults.has(conv.id))
          .forEach((conv) => {
            createRow({
              name: conv.name,
              preview: conv.preview,
              onOpen: () => {
                const params = new URLSearchParams({ i: conv.id, n: conv.name });
                location.href = 'chat.html?' + params.toString();
              },
              onDelete: () => {
                const updated = loadDeletedDefaults();
                updated.add(conv.id);
                saveDeletedDefaults(updated);
                renderConversations();
              }
            });
          });

        const conversations = loadConversations();
        conversations
          .slice()
          .sort((a, b) => getLastTimestamp(b) - getLastTimestamp(a))
          .forEach(conv => {
            const last = conv.messages && conv.messages.length ? conv.messages[conv.messages.length - 1].text : '';
            const preview = (last || '').trim() || 'Sem mensagens';

            createRow({
              name: conv.name || 'Contacto',
              preview,
              onOpen: () => {
                const params = new URLSearchParams({
                  i: conv.id,
                  n: conv.name || 'Contacto'
                });
                location.href = 'chat.html?' + params.toString();
              },
              onDelete: () => {
                const remaining = loadConversations().filter((c) => c.id !== conv.id);
                saveConversations(remaining);
                renderConversations();
              }
            });
          });
      }

      document.addEventListener('DOMContentLoaded', renderConversations);
    })();
  </script>
</body>
</html>
