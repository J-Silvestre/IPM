<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Interativo</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="scripts/theme.js" defer></script>
</head>
<body class="map-page">

<div class="app">
  <div class="card">
    
    <!-- Header -->
    <div class="header">
      <select id="concelho" name="concelho">
              <option value="">-- selecionar concelho --</option>
              <option>Sintra</option>
              <option>Lisboa</option>
              <option>Amadora</option>
              <option>Oeiras</option>
              <option>Cascais</option>
              <option>Loures</option>
              <option>Odivelas</option>
              <option>Vila Franca de Xira</option>
              <option>Mafra</option>
              <option>Almada</option>
              <option>Seixal</option>
              <option>Barreiro</option>
              <option>Moita</option>
              <option>Montijo</option>
              <option>Alcochete</option>
              <option>Palmela</option>
              <option>Sesimbra</option>
              <option>Setúbal</option>
       </select>
       <button class="help-btn" id="helpConcelho">?</button>
    </div>

    <div id="aruWarning" class="aru-warning">Estás dentro de uma ARU!</div>

    <!-- Map section -->
    <div class="map-section">
      <div id="map" class="map-box">
      </div>
      <div id="distanceWarning" class="aru-warning" style="display:none;margin-top:8px;"></div>
    </div>

    <!-- Benefícios button between map and footer -->
    <button id="beneficiosBtn">Benefícios e Penalizações</button>

    <!-- Footer -->
<div class="footer">
  <div class="navbar">

    <div class="nav-item">
      <button onclick="location.href='perfil.html'">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
             stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M4 21v-2a4 4 0 0 1 3-3.87"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="nav-label">perfil</span>
      </button>
    </div>

    <div class="nav-item">
      <button onclick="location.href='messages.html'">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
             stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="nav-label">mensagens</span>
      </button>
    </div>

    <div class="nav-item">
      <button onclick="location.href='search.html'">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
             stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="nav-label">procurar</span>
      </button>
    </div>

  </div>
</div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-pip/leaflet-pip.min.js"></script>
<script src="scripts/area.js"></script>

</body>
</html>
