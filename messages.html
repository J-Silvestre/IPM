<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens</title>
  <link rel="stylesheet" href="style.css">
  <script src="scripts/theme.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="card" role="main" aria-labelledby="messagesTitle" style="justify-content:flex-start;">
      <div class="header">
        <button class="btn btn-primary" onclick="location.href='area.html'">←</button>
        <h2 id="messagesTitle">Mensagens</h2>
      </div>

      <div class="chat-list" style="margin-top: 8px; display:flex; flex-direction:column; gap:8px;">
        <button class="input chat" type="button" onclick="location.href='chat.html'">
          <strong>Arquiteto 1</strong>
          <span style="margin-left:8px; color:var(--muted);">Enviei-lhe as plantas atualizadas.</span>
        </button>
        <button class="input chat" type="button" onclick="location.href='chat.html'">
          <strong>Ana</strong>
          <span style="margin-left:8px; color:var(--muted);">Olá! Tudo bem?</span>
        </button>
        <button class="input chat" type="button" onclick="location.href='chat.html'">
          <strong>João</strong>
          <span style="margin-left:8px; color:var(--muted);">Podemos falar amanhã?</span>
        </button>
        <button class="input chat" type="button" onclick="location.href='chat.html'">
          <strong>Sara</strong>
          <span style="margin-left:8px; color:var(--muted);">Enviei o documento!</span>
        </button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const STORAGE_KEY = 'conversations';

      function loadConversations() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        } catch (e) {
          return [];
        }
      }

      function getLastTimestamp(conversation) {
        const last = conversation && conversation.messages && conversation.messages[conversation.messages.length - 1];
        return last && typeof last.ts === 'number' ? last.ts : 0;
      }

      function renderSavedConversations() {
        const list = document.querySelector('.chat-list');
        if (!list) return;

        const conversations = loadConversations();
        if (!conversations.length) return;

        conversations
          .slice()
          .sort((a, b) => getLastTimestamp(b) - getLastTimestamp(a))
          .forEach(conv => {
            const last = conv.messages && conv.messages.length ? conv.messages[conv.messages.length - 1].text : '';
            const preview = (last || '').trim() || 'Sem mensagens';

            const btn = document.createElement('button');
            btn.className = 'input chat';
            btn.type = 'button';
            btn.onclick = () => { location.href = 'chat.html?i=' + encodeURIComponent(conv.id); };
            btn.innerHTML = `<strong>${conv.name || 'Contacto'}</strong>
              <span style="margin-left:8px; color:var(--muted);">${preview}</span>`;

            list.appendChild(btn);
          });
      }

      document.addEventListener('DOMContentLoaded', renderSavedConversations);
    })();
  </script>
</body>
</html>
